# Carga histórica (Lote 3.1, HU-024) · ARCHITECTURE.md §3.17 y §5.12.
# Todo lo de aquí cambia el plan (y su `config_sha256`): cambiarlo y volver a generar
# produce otro dataset. HIST_SEED y HIST_N pisan `seed` y `n`; la CLI pisa todo lo demás.

seed: 3101            # HIST_SEED. Distinta de SIM_SEED (7): los event_id no chocan con el stream.
n: 50000              # HIST_N. Total de registros, repartidos entre las fuentes.
days: 180             # Ventana [as_of - days, as_of).
as_of: null           # null = hoy a las 00:00 UTC (se guarda en el manifiesto y se reutiliza).
chunk_size: 2000      # Filas por archivo de etapa (stage1/stage2): unidad de reanudación del NLP.

sources:              # Reparto entre fuentes (se normaliza a n).
  reddit: 1.0
  facebook: 1.0
  instagram: 1.0

# Estacionalidad en hora local de Colombia (UTC-5, sin horario de verano, §5.12).
# Se almacena todo en UTC; estos perfiles solo deciden cuántos posts caen en cada hora.
local_utc_offset_hours: -5
weekly:               # lunes .. domingo
  [0.85, 0.82, 0.88, 0.95, 1.12, 1.30, 1.18]
hourly:               # 00 .. 23 (hora local)
  [0.30, 0.20, 0.14, 0.11, 0.11, 0.18, 0.38, 0.62, 0.82, 0.92, 1.00, 1.10,
   1.32, 1.28, 1.05, 0.98, 1.02, 1.12, 1.30, 1.46, 1.50, 1.32, 0.95, 0.58]

growth: 0.30          # +30 % de volumen de punta a punta de la ventana (lineal).
daily_noise: 0.10     # Desviación (lognormal) del volumen de cada día; 0 la apaga.

# Tendencia de cada marca: su factor pasa de 1 a (1 + trend) a lo largo de la ventana.
# Multiplica la mezcla de marcas del simulador (BrandSelector, §3.10), no la reemplaza.
brands:
  postobon: {trend: -0.10}
  pepsi: {trend: 0.35}
  sprite: {trend: 0.00}

# Episodios para que haya historia que comparar. `start_days_ago` cuenta desde as_of.
# `volume` multiplica el volumen de la marca; `sentiment` multiplica la probabilidad de
# aceptar cada ground truth (positive, negative, neutral, null) de esa marca.
events:
  - name: campana_sprite
    brand: sprite
    start_days_ago: 120
    duration_days: 10
    volume: 1.8
    sentiment: {positive: 1.5}
  - name: crisis_postobon
    brand: postobon
    start_days_ago: 40
    duration_days: 6
    volume: 1.5
    sentiment: {negative: 3.0, positive: 0.6}

# Tope de candidatos (seq) por hueco de tiempo; si se alcanza se acepta el último
# (contador `forced`). Con los valores de arriba la aceptación media es ~0,6.
max_candidates_per_slot: 200
